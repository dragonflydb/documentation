name: Check Markdown Links

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.lychee.toml'
      - '.github/workflows/check-links.yml'
  schedule:
    # Run daily at 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Internal links, anchors, and images are resolved by Docusaurus
      # (onBrokenLinks and onBrokenAnchors are set to "throw" in docusaurus.config.mjs).
      # This is deterministic, so a failure here blocks the pull request.
      - name: Check internal links (Docusaurus build)
        run: yarn build

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      # External links depend on third-party sites, so each unique URL is checked once, with retries.
      # See .lychee.toml for the settings.
      # - Pull requests: check only the docs files the PR changes, so a PR is blocked only by links it can fix.
      #   If the PR changes this workflow or .lychee.toml, check all docs to validate the change.
      # - Scheduled and manual runs: check all docs. A broken link fails the run and sends a notification.
      - name: Select files for the external link check
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          all="'docs/**/*.md'"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            files="$all"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(\.lychee\.toml|\.github/workflows/check-links\.yml)$'; then
            files="$all"
          else
            files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'docs/*.md' | tr '\n' ' ')
          fi
          echo "Files to check: ${files:-none}"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Check external links
        if: steps.files.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .lychee.toml --root-dir ${{ github.workspace }} --no-progress ${{ steps.files.outputs.files }}
          fail: true
          jobSummary: true

      - name: Send notification on failure
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          job_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="Link check failed in documentation.\nJob Link: ${job_link}"

          curl -s \
            -X POST \
            -H 'Content-Type: application/json' \
            '${{ secrets.GSPACES_BOT_DF_BUILD }}' \
            -d '{"text": "'"${message}"'"}'
