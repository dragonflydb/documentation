name: Check Markdown Links

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '.lychee.toml'
      - '.github/workflows/check-links.yml'
  schedule:
    # Run daily at 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Internal links, anchors, and images are resolved by Docusaurus (onBrokenLinks: "throw").
      # This is deterministic, so a failure here blocks the pull request.
      - name: Check internal links (Docusaurus build)
        run: yarn build

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      # External links depend on third-party sites, so a failure can be temporary.
      # Each unique URL is checked once, with retries. See .lychee.toml for the settings.
      # On pull requests the result is reported but does not block the merge.
      # The scheduled run fails when a link is still broken, so dead links are found and fixed.
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .lychee.toml --root-dir ${{ github.workspace }} --no-progress 'docs/**/*.md'
          fail: true
          jobSummary: true

      - name: Send notification on failure
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          job_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          message="Link check failed in documentation.\nJob Link: ${job_link}"

          curl -s \
            -X POST \
            -H 'Content-Type: application/json' \
            '${{ secrets.GSPACES_BOT_DF_BUILD }}' \
            -d '{"text": "'"${message}"'"}'
